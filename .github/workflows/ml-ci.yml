name: Student Performance ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train student performance model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: student-performance-ml-artifacts
          path: |
            student_performance_model.pkl
            metrics.json
            student_performance_processed.csv
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp student_performance_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Student Performance Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-performance-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Build Docker image
        run: docker build -t student-performance-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-performance-ml-container \
            -p 5000:5000 \
            student-performance-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo ""
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs student-performance-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"gender":"female","race_ethnicity":"group C","parental_level_of_education":"bachelor'"'"'s degree","lunch":"standard","test_preparation_course":"completed","reading_score":90,"writing_score":88}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs student-performance-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f student-performance-ml-container || true
